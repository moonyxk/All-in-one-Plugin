# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
name: AllInOnePlugin
main: dev.moonyxk.allinoneplugin.AllInOnePlugin
author: moonyxk
version: '${plugin.version}'
api-version: '26.3'
commands:
  heal:
    description: Heilt einen Spieler vollständig.
    usage: /heal <Spieler>
    permission: allinoneplugin.mod
  feed:
    description: Füllt die Hungeranzeige eines Spielers.
    usage: /feed <Spieler>
    permission: allinoneplugin.mod
  fly:
    description: Aktiviert oder deaktiviert das Fliegen für einen Spieler.
    usage: /fly <Spieler>
    permission: allinoneplugin.mod
  kick:
    description: Entfernt einen Spieler mit Begründung vom Server.
    usage: /kick <Spieler> <Grund>
    permission: allinoneplugin.mod
  boom:
    description: Erzeugt eine Explosion um einen Spieler.
    usage: /boom <Spieler>
    permission: allinoneplugin.mod
permissions:
  allinoneplugin.mod:
    description: Erlaubt die Nutzung der Moderator-Befehle.
    default: op
