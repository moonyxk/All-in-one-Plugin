# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
name: AllInOnePlugin
main: dev.moonyxk.allinoneplugin.AllInOnePlugin
author: moonyxk
version: '${plugin.version}'
api-version: '26.3'
commands:
  heal:
    description: Heilt einen Spieler vollständig.
    usage: /heal <Spieler>
    permission: allinoneplugin.mod
  feed:
    description: Füllt die Hungeranzeige eines Spielers.
    usage: /feed <Spieler>
    permission: allinoneplugin.mod
  fly:
    description: Aktiviert oder deaktiviert das Fliegen für einen Spieler.
    usage: /fly <Spieler>
    permission: allinoneplugin.mod
  kick:
    description: Entfernt einen Spieler mit Begründung vom Server.
    usage: /kick <Spieler> <Grund>
    permission: allinoneplugin.mod
  boom:
    description: Erzeugt eine Explosion um einen Spieler, optional ohne Schaden.
    usage: /boom <Spieler> [true|false]
    permission: allinoneplugin.mod
  sigma:
    description: Öffnet das Menü zum Aktivieren und Deaktivieren von Funktionen.
    usage: /sigma [Funktion] [on|off]
  menu:
    description: Öffnet dein persönliches Einstellungsmenü.
    usage: /menu
  chestpunch:
    description: Schaltet ChestPunch für dich selbst ein oder aus.
    usage: /chestpunch
    permission: allinoneplugin.chestpunch
permissions:
  allinoneplugin.mod:
    description: Erlaubt die Nutzung der Moderator-Befehle.
    default: op
  allinoneplugin.sigma:
    description: Erlaubt das Aktivieren und Deaktivieren von Funktionen über /sigma.
    default: op
  allinoneplugin.chestpunch:
    description: Erlaubt die Nutzung von ChestPunch.
    default: true
