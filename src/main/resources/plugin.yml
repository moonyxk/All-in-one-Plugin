# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
name: AllInOnePlugin
main: dev.moonyxk.allinoneplugin.AllInOnePlugin
author: moonyxk
version: '${plugin.version}'
api-version: '26.3'
commands:
  test:
    description: Ein Testbefehl.
    usage: /test
  heal:
    description: Heilt den Spieler vollständig.
    usage: /heal
  feed:
    description: Füllt die Hungeranzeige des Spielers.
    usage: /feed
  fly:
    description: Aktiviert oder deaktiviert das Fliegen für den Spieler.
    usage: /fly
  kick:
    description: Entfernt einen Spieler mit Begründung vom Server.
    usage: /kick <Spieler> <Grund>
    permission: allinoneplugin.kick
  boom:
    description: Erzeugt eine Explosion um den Spieler.
    usage: /boom
  balance:
    description: Zeigt deinen aktuellen Kontostand an.
    usage: /balance
  pay:
    description: Sende Coins an einen anderen Spieler.
    usage: /pay <Spieler> <Betrag>
  shop:
    description: Kaufe ein Item mit Ingame-Währung.
    usage: /shop <item> <price>
permissions:
  allinoneplugin.kick:
    description: Erlaubt das Kicken von Spielern.
    default: op
